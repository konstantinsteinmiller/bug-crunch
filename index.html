<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bug Crunch">
  <meta name="description" content="Stomp, slam and slide your way through swarms of googly-eyed bugs. Build a Splat Chain, fill the Juice vial and let the Gilded Boot loose.">
  <link rel="manifest" href="/manifest.json">
  <title>Bug Crunch</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. They match the scene's
         night-sky background so the handover to the canvas is seamless — no
         flash of a differently-coloured page. */
      body {
          margin: 0;
          background-color: #120c1e;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          /* The tile layer below is one tile wider and taller than the screen;
             without this it would hand the page a scrollbar. */
          overflow: hidden;
          background: radial-gradient(circle at 50% 38%, #2b1d45 0%, #120c1e 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* The panning backdrop.
         ------------------------------------------------------------------
         The game's own cast — the ant, the sprinter, the beetle, the moth, the
         piñata fly, the sneaker, the mascot and the coin — flattened to faint
         three-tone line drawings on one seamless tile
         (public/images/bg/bg-tile_800x800.webp, written by `pnpm art:bg-tile`
         from the PAINTINGS themselves, so repainting a sprite and re-running it
         follows the art), drifting down and to the right the way a Brawl Stars
         loading screen does.

         The layer is one tile bigger than the screen up and to the left, and
         slides exactly one tile down-right before it loops, so the loop has
         no seam. It moves by TRANSFORM, never background-position: a
         transform runs on the compositor, so the drift stays smooth while the
         main thread is busy booting the game — which is the whole time this
         screen is up.

         The URL is RELATIVE on purpose. Vite rewrites `src`/`href`
         attributes against the build's base but leaves `url()` inside an
         inline <style> alone, and `./` resolves against this document
         wherever it is deployed — the site root, a `--base=./` portal zip, or
         the `/bug-crunch/` GitHub path — where a leading slash would only
         work for the first.

         It is a file both splashes name, so it arrives a beat after the first
         frame; the fade-in hides that. FLogoProgress draws the same layer and
         adopts this one's clock at the handover. Change one, change both. */
      .splash-tiles {
          position: absolute;
          top: -400px;
          left: -400px;
          right: 0;
          bottom: 0;
          background: url(./images/bg/bg-tile_800x800.webp) 0 0 / 400px 400px repeat;
          opacity: 0.16;
          will-change: transform;
          animation: splash-tiles-in 0.6s ease-out both, splash-tiles-pan 40s linear infinite;
      }

      @keyframes splash-tiles-in {
          from { opacity: 0; }
      }

      @keyframes splash-tiles-pan {
          to { transform: translate3d(400px, 400px, 0); }
      }

      /* The greeting card, minus its punchline.
         ------------------------------------------------------------------
         The same picture `FLogoProgress.vue` draws — the ant floating over the
         mark — at the SAME size in the SAME place, so when Vue mounts and this
         element fades out, nothing moves. The speech bubble is the only thing
         that is not here, and it pops in on top of this once the fade has
         finished (see `LURK_MS` in that component).

         Duplicated rather than shared because this has to paint before any
         stylesheet or module has been fetched. Change one, change both.

         The two `<img>` sources are absolute public paths — Vite rewrites
         them against the build's base, the same as the favicon and manifest
         links above, so the relative-base portal builds resolve them too. */
      .splash-greet {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.55rem;
          width: clamp(200px, 58vmin, 340px);
      }

      .splash-stage {
          position: relative;
          width: 100%;
          aspect-ratio: 340 / 200;
      }

      /* The mascot: one ant, floating. It stands in the LEFT half of the stage
         so the speech bubble the Vue splash pops in on top of this has the
         right half to itself on a 320 px phone. */
      .splash-wisp {
          position: absolute;
          left: 1%;
          bottom: -2%;
          height: 112%;
          aspect-ratio: 1 / 1;
          animation: splash-float 2.6s ease-in-out infinite;
      }

      /* max-width beats the app stylesheet's image reset once it lands, and the
         height beats the tag's own width/height attributes — those are
         presentational hints, and they are on the tag so this does not reflow
         when the file decodes. */
      .splash-wisp img {
          display: block;
          max-width: none;
          width: 100%;
          height: 100%;
      }

      /* The mark, at its own square. `pnpm brand` writes it edge to edge with a
         small margin, so nothing is cropped here. */
      .splash-logo {
          width: 46%;
          aspect-ratio: 1 / 1;
      }

      .splash-logo img {
          display: block;
          width: 100%;
          height: 100%;
      }

      /* The loading read-out's placeholder. It is here for the SPACE as much as
         the number: without it the card is one line shorter than the one
         FLogoProgress draws, so the whole composition would jump upward at the
         handover. The colour, size and shadow match `.percentage-text` +
         `.text-shadow` + `.text-amber-500` in the app's stylesheet, which has
         not loaded yet at this point. */
      .splash-progress {
          font-size: clamp(0.9rem, 4vw, 1.35rem);
          font-weight: 900;
          /* The app stylesheet's default, restated: the UA's own 'normal' is
             tighter, and a line 7 px shorter here would centre the whole card
             3 px lower than the one Vue draws. */
          line-height: 1.5;
          color: #fe9a00;
          text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      }

      @keyframes splash-float {
          0%, 100% { transform: translateY(0) rotate(-1.5deg); }
          50%      { transform: translateY(-6%) rotate(1.5deg); }
      }

      @media (prefers-reduced-motion: reduce) {
          .splash-wisp, .splash-tiles { animation: none; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="splash-tiles" aria-hidden="true"></div>
  <div class="splash-greet">
    <div class="splash-stage">
      <div class="splash-wisp">
        <img src="/images/logo/mascot.webp" alt="" width="512" height="512" fetchpriority="high">
      </div>
    </div>
    <div class="splash-logo">
      <img src="/images/logo/logo_512x512.png" alt="Bug Crunch" width="512" height="512" fetchpriority="high">
    </div>
    <span class="splash-progress">0%</span>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
